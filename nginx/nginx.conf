user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimizaciones básicas
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compresión GZIP (salva ancho de banda y carga más rápido)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Seguridad: Ocultar versión de Nginx
    server_tokens off;

    # Limitar tamaño de subida (Fotos de productos)
    client_max_body_size 10M;

    # Rate Limiting: Prevenir ataques de fuerza bruta
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 1) REDIRECCIÓN HTTP -> HTTPS
    server {
        listen 80;
        server_name api.lajambre.cl admin.lajambre.cl lajambre.cl;

        # Endpoint para que Certbot renueve certificados
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirigir todo el resto a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2) BLOQUE HTTPS PARA LA API (Backend)
    server {
        listen 443 ssl http2;
        server_name api.lajambre.cl;

        ssl_certificate /etc/letsencrypt/live/api.lajambre.cl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.lajambre.cl/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # 3) BLOQUE HTTPS PARA LA APP WEB (PWA)
    server {
        listen 443 ssl http2;
        server_name lajambre.cl admin.lajambre.cl;

        # Idealmente usa certificados wildcards o específicos para cada subdominio
        ssl_certificate /etc/letsencrypt/live/lajambre.cl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lajambre.cl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://frontend_web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
