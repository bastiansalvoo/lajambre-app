server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: si el archivo pedido no existe fisicamente (rutas
    # de expo-router como /profile, /login, etc.), servir index.html y
    # dejar que el router del lado del cliente decida que pantalla mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
