version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lajambre_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_NAME:-lajambre}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo accesible desde el propio VPS (127.0.0.1) — para conectar un
    # cliente tipo DBeaver hay que entrar por tunel SSH, nunca expuesto
    # directo a internet.
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=100
    networks:
      - app-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: lajambre_backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env.production
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-network

  frontend_web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: lajambre_frontend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: lajambre_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend_web
    networks:
      - app-network

volumes:
  pgdata:
  uploads_data:

networks:
  app-network:
    driver: bridge
